run:
  name: ppo_refine_conservative
  output_dir: results/ppo_refine_conservative
  episodes: 20
  max_steps: 1000
  seed: 0

env:
  id: LunarLander-v3
  render_mode: null
  continuous: false
  enable_wind: false
  wind_power: 15.0
  turbulence_power: 1.5

policy:
  name: ppo

video:
  enabled: false
  record_every: 10
  prefix: ppo_refine_conservative

ppo:
  total_timesteps: 120000
  steps_per_rollout: 4096
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 0.00005
  update_epochs: 4
  minibatch_size: 256
  clip_epsilon: 0.1
  value_coef: 0.5
  entropy_coef: 0.0
  max_grad_norm: 0.5
  log_every_updates: 5
  eval_every_updates: 5
  eval_episodes: 100
