[project]
name = "start-trek"
version = "0.1.0"
description = "Lunar Lander reinforcement-learning project scaffold."
requires-python = ">=3.10"
dependencies = [
    "gymnasium[box2d]>=1.0.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
